<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>squared2</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="level-panel" class="panel panel--edit_level">
      <button id="save-button" class="button button--primary">
        <p class="panel-button-label">Save</p>
      </button>
      <button id="close-button" class="button">
        <p class="panel-button-label">Close</p>
      </button>
    </div>
    <template id="template-button">
      <button class="button">
        <p class="panel-button-label"></p>
      </button>
    </template>
    <template id="template-divider">
      <div class="divider"></div>
    </template>
    <template id="template-icon">
      <svg
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></svg>
    </template>
    <template id="template-diode">
      <span class="diode"></span>
    </template>
    <template id="template-textinput">
      <input type="text" class="textinput" />
    </template>
    <template id="template-plus-minus-button">
      <div class="plus-minus-button">
        <button class="plus-minus-button-decrease">
          <p class="plus-minus-symbol plus-minus-symbol--decrease"></p>
        </button>
        <p class="plus-minus-button-label"></p>
        <button class="plus-minus-button-increase">
          <p class="plus-minus-symbol plus-minus-symbol--increase"></p>
        </button>
      </div>
    </template>
    <script src="/dist/main.js"></script>
  </body>
</html>
